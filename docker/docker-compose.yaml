version: '3.8'

services:
  postgres-shard-1:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shop_db_1
    ports:
      - "5432:5432"
    volumes:
      - pgdata_shard1:/var/lib/postgresql/data

  postgres-shard-2:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: shop_db_2
    ports:
      - "5433:5432"
    volumes:
      - pgdata_shard2:/var/lib/postgresql/data

  mongodb:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

volumes:
  pgdata_shard1:
  pgdata_shard2:
  mongodata:
