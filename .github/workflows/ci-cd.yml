name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # NEXT_PUBLIC_* được bake vào bundle frontend TẠI build-time. Lấy từ repo Variables
  # (Settings → Secrets and variables → Actions → Variables), fallback domain prod.
  NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.tvgx1.id.vn' }}
  NEXT_PUBLIC_STOREFRONT_URL: ${{ vars.NEXT_PUBLIC_STOREFRONT_URL || 'https://tvgx1.id.vn' }}
  NEXT_PUBLIC_STOREFRONT_HOST: ${{ vars.NEXT_PUBLIC_STOREFRONT_HOST || 'tvgx1.id.vn' }}
  NEXT_PUBLIC_STOREFRONT_PROTOCOL: ${{ vars.NEXT_PUBLIC_STOREFRONT_PROTOCOL || 'https' }}
  NEXT_PUBLIC_IMAGE_PROXY_URL: ${{ vars.NEXT_PUBLIC_IMAGE_PROXY_URL || 'https://images.tvgx1.id.vn' }}
  NEXT_PUBLIC_CDN_URL: ${{ vars.NEXT_PUBLIC_CDN_URL || 'https://cdn.tvgx1.id.vn' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Prisma Client is generated from packages/database/prisma/models/*.prisma.
      # A clean `npm ci` only produces a STUB client (the auto-postinstall can't
      # find the schema at a default monorepo path), so api-core's tsc build fails
      # with ~70 "Property does not exist on type '{}'" / implicit-any errors.
      # Build the schema + generate the real client BEFORE check-types and build.
      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Type Check
        run: npm run check-types

      - name: Build Turbo Cache
        run: npx turbo run build

  build-and-push-api-core:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-api-core
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api-core/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-and-push-storefront:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-storefront
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/storefront/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_IMAGE_PROXY_URL=${{ env.NEXT_PUBLIC_IMAGE_PROXY_URL }}
            NEXT_PUBLIC_CDN_URL=${{ env.NEXT_PUBLIC_CDN_URL }}

  build-and-push-admin:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-admin
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_STOREFRONT_URL=${{ env.NEXT_PUBLIC_STOREFRONT_URL }}
            NEXT_PUBLIC_STOREFRONT_HOST=${{ env.NEXT_PUBLIC_STOREFRONT_HOST }}
            NEXT_PUBLIC_STOREFRONT_PROTOCOL=${{ env.NEXT_PUBLIC_STOREFRONT_PROTOCOL }}
            NEXT_PUBLIC_CDN_URL=${{ env.NEXT_PUBLIC_CDN_URL }}
            NEXT_PUBLIC_IMAGE_PROXY_URL=${{ env.NEXT_PUBLIC_IMAGE_PROXY_URL }}

  build-and-push-shop-builder:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-shop-builder
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: scripts/shop-builder/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-and-push-design-agent:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-design-agent
          tags: |
            type=sha
            type=raw,value=latest

      # design-agent has no NEXT_PUBLIC_* build args (it is a NestJS server, not a
      # Next.js app). All its secrets (ANTHROPIC_API_KEY, VOYAGE_API_KEY, FIGMA_*)
      # are injected at RUNTIME via the prod .env, never baked into the image.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/design-agent/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
