apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecommerce-cli-backup-daily
  namespace: ecommerce-cli
  labels:
    app: ecommerce-cli
    operation: backup
    schedule: daily
spec:
  # Every day at 2 AM UTC
  schedule: "0 2 * * *"
  
  # Keep last 3 successful and 1 failed job
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  
  # Do not start new job if previous one is still running
  concurrencyPolicy: Forbid
  
  jobTemplate:
    metadata:
      labels:
        app: ecommerce-cli
        operation: backup-daily
    spec:
      ttlSecondsAfterFinished: 604800  # 7 days
      
      template:
        metadata:
          labels:
            app: ecommerce-cli
            operation: backup-daily
        spec:
          serviceAccountName: ecommerce-cli
          restartPolicy: OnFailure
          
          containers:
            - name: backup
              image: ecommerce-cli:latest
              imagePullPolicy: IfNotPresent
              
              command:
                - /bin/sh
                - -c
              args:
                - |
                  echo "Starting daily backup job..."
                  echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                  
                  # Get all shop IDs
                  SHOPS=$(python main.py shop list --json | jq -r '.[].id')
                  SHOP_COUNT=$(echo "$SHOPS" | wc -l)
                  SUCCESS=0
                  FAILED=0
                  
                  echo "Backing up $SHOP_COUNT shops..."
                  
                  for SHOP_ID in $SHOPS; do
                    if python main.py backup create "$SHOP_ID" > /tmp/backup_$SHOP_ID.log 2>&1; then
                      ((SUCCESS++))
                      echo "✓ Backed up $SHOP_ID"
                    else
                      ((FAILED++))
                      echo "✗ Failed to backup $SHOP_ID"
                      cat /tmp/backup_$SHOP_ID.log
                    fi
                  done
                  
                  echo "Backup job completed:"
                  echo "  Successful: $SUCCESS"
                  echo "  Failed: $FAILED"
                  
                  if [ $FAILED -gt 0 ]; then
                    exit 1
                  fi
              
              env:
                - name: API_URL
                  valueFrom:
                    secretKeyRef:
                      name: ecommerce-cli-secrets
                      key: API_URL
                - name: API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ecommerce-cli-secrets
                      key: API_KEY
                - name: CLI_ENV
                  valueFrom:
                    configMapKeyRef:
                      name: ecommerce-cli-config
                      key: CLI_ENV
                - name: PYTHONUNBUFFERED
                  value: "1"
              
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "500m"
                limits:
                  memory: "1Gi"
                  cpu: "1000m"
              
              volumeMounts:
                - name: backup-storage
                  mountPath: /home/cli-user/.ecommerce-cli/backups
          
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: ecommerce-cli-backups

