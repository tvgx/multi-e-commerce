apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecommerce-cli-health-checks-weekly
  namespace: ecommerce-cli
  labels:
    app: ecommerce-cli
    operation: health-check
    schedule: weekly
spec:
  # Every Sunday at 3 AM UTC
  schedule: "0 3 * * 0"
  
  # Keep last 4 successful and 1 failed job
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 1
  
  concurrencyPolicy: Forbid
  
  jobTemplate:
    metadata:
      labels:
        app: ecommerce-cli
        operation: health-check-weekly
    spec:
      ttlSecondsAfterFinished: 2592000  # 30 days
      
      template:
        metadata:
          labels:
            app: ecommerce-cli
            operation: health-check-weekly
        spec:
          serviceAccountName: ecommerce-cli
          restartPolicy: OnFailure
          
          containers:
            - name: health-check
              image: ecommerce-cli:latest
              imagePullPolicy: IfNotPresent
              
              command:
                - /bin/sh
                - -c
              args:
                - |
                  echo "Starting weekly health checks..."
                  echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
                  
                  SHOPS=$(python main.py shop list --json | jq -r '.[].id')
                  SHOP_COUNT=$(echo "$SHOPS" | wc -l)
                  
                  echo "Running health checks on $SHOP_COUNT shops..."
                  
                  HEALTH_REPORT="/tmp/health-report-$(date +%Y%m%d).json"
                  echo "[" > "$HEALTH_REPORT"
                  
                  FIRST=true
                  for SHOP_ID in $SHOPS; do
                    if ! $FIRST; then echo "," >> "$HEALTH_REPORT"; fi
                    python main.py health check "$SHOP_ID" --json >> "$HEALTH_REPORT"
                    FIRST=false
                  done
                  
                  echo "]" >> "$HEALTH_REPORT"
                  
                  echo "Health report saved to $HEALTH_REPORT"
                  
                  # Count shops with low health scores
                  LOW_HEALTH=$(jq '[.[] | select(.health_score < 80)] | length' "$HEALTH_REPORT")
                  echo "Shops with low health: $LOW_HEALTH"
                  
                  if [ "$LOW_HEALTH" -gt 5 ]; then
                    echo "WARNING: Multiple shops have low health scores"
                    jq '.[] | select(.health_score < 80) | {shop_id, health_score}' "$HEALTH_REPORT"
                  fi
              
              env:
                - name: API_URL
                  valueFrom:
                    secretKeyRef:
                      name: ecommerce-cli-secrets
                      key: API_URL
                - name: API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ecommerce-cli-secrets
                      key: API_KEY
                - name: CLI_ENV
                  valueFrom:
                    configMapKeyRef:
                      name: ecommerce-cli-config
                      key: CLI_ENV
                - name: PYTHONUNBUFFERED
                  value: "1"
              
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "500m"
                limits:
                  memory: "2Gi"
                  cpu: "2000m"

