apiVersion: v1
kind: Namespace
metadata:
  name: ecommerce
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ecommerce-quota
  namespace: ecommerce
spec:
  hard:
    pods: "20"  # 3 deployments x 3 replicas + monitoring + cli-backup = ~15 pods + buffer
    requests.cpu: "4"  # WSL ~4 cores; realistic for 9-12 pods
    requests.memory: 8Gi  # ~8-10GB available; reasonable for staging
    limits.cpu: "8"  # Ceiling to prevent runaway pods
    limits.memory: 12Gi  # Safe max for WSL ~16GB total RAM
