apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: ecommerce
spec:
  ports:
    - port: 3002
  selector:
    app: storefront
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: ecommerce
spec:
  replicas: 2
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: storefront
          image: ecommerce-storefront:latest
          ports:
            - containerPort: 3002
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://api.ecommerce.local"
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
