apiVersion: v1
kind: ConfigMap
metadata:
  name: storefront-config
  namespace: ecommerce
data:
  PORT: "5201"
  NODE_ENV: "production"
  REVALIDATE_SECRET: "dev_secret"
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: ecommerce
spec:
  ports:
    - port: 5201
      targetPort: 5201
  selector:
    app: storefront
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      containers:
        - name: storefront
          image: ecommerce-storefront:latest
          ports:
            - containerPort: 5201
          envFrom:
            - configMapRef:
                name: storefront-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "350Mi"
