---
apiVersion: v1
kind: Service
metadata:
  name: api-core
  namespace: ecommerce
spec:
  ports:
    - port: 3001
  selector:
    app: api-core
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-core
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-core
  template:
    metadata:
      labels:
        app: api-core
    spec:
      containers:
        - name: api-core
          image: ecommerce-api-core:latest # This would be replaced by actual registry image
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: api-core-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "350Mi"
