# ⚠️ Secret phải được tạo trước khi apply:
# kubectl create secret generic api-core-secret -n ecommerce \
#   --from-literal=DATABASE_URL_SHARD_1='postgresql://...' \
#   --from-literal=DATABASE_URL_SHARD_2='postgresql://...' \
#   --from-literal=MONGODB_URI='mongodb+srv://...'
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-core-config
  namespace: ecommerce
data:
  PORT: "3001"
  NODE_ENV: "production"
  REDIS_URL: "redis://redis:6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-core-secret
  namespace: ecommerce
type: Opaque
stringData:
  DATABASE_URL_SHARD_1: "postgresql://postgres:CHANGE_ME@db.dabexhaqtamfxcwpujuy.supabase.co:5432/postgres?schema=public"
  DATABASE_URL_SHARD_2: "postgresql://postgres:CHANGE_ME@db.dabexhaqtamfxcwpujuy.supabase.co:5432/postgres?schema=public"
  MONGODB_URI: "mongodb+srv://CHANGE_ME:CHANGE_ME@jsondb1.ddnq5v9.mongodb.net/?appName=JSONdb1"
---
apiVersion: v1
kind: Service
metadata:
  name: api-core
  namespace: ecommerce
spec:
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: api-core
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-core
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-core
  template:
    metadata:
      labels:
        app: api-core
    spec:
      containers:
        - name: api-core
          image: ecommerce-api-core:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: api-core-config
            - secretRef:
                name: api-core-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "350Mi"
