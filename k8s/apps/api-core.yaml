# ⚠️ Secret phải được tạo trước khi apply:
# bash scripts/create-k8s-secrets.sh
# 
# Required environment variables:
#   - DB_PASSWORD: Database password for PostgreSQL
#   - DB_HOST: Database host (optional, defaults to postgres.ecommerce.svc.cluster.local)
#   - BETTER_AUTH_SECRET: Secret key for better-auth sessions (minimum 32 characters)
#   - MONGO_PASSWORD: MongoDB password (optional for local dev)
#   - CLI_ENV: Environment identifier (development|staging|production)
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-core-config
  namespace: ecommerce
data:
  PORT: "3000"
  NODE_ENV: "production"
  REDIS_URL: "redis://redis:6379"
  # Environment for audit logging and feature flags (per AGENTS.md)
  CLI_ENV: "development"
---
apiVersion: v1
kind: Secret
metadata:
  name: api-core-secret
  namespace: ecommerce
type: Opaque
stringData:
  # Database URIs (created via scripts/create-k8s-secrets.sh)
  DATABASE_URL_SHARD_1: "postgresql://postgres:CHANGE_ME@db.dabexhaqtamfxcwpujuy.supabase.co:5432/postgres?schema=public"
  DATABASE_URL_SHARD_2: "postgresql://postgres:CHANGE_ME@db.dabexhaqtamfxcwpujuy.supabase.co:5432/postgres?schema=public"
  MONGODB_URI: "mongodb+srv://CHANGE_ME:CHANGE_ME@jsondb1.ddnq5v9.mongodb.net/?appName=JSONdb1"
  # Better Auth Configuration (per AGENTS.md)
  # Secret key for session encryption/signing. Minimum 32 characters.
  # Rotation schedule: Monthly (dev), Quarterly (ops), Bi-weekly (platform admin)
  BETTER_AUTH_SECRET: "CHANGE_ME_avx0LJLBgGitJDQzys3js69JZFgEC22C"
---
apiVersion: v1
kind: Service
metadata:
  name: api-core
  namespace: ecommerce
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: api-core
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-core
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-core
  template:
    metadata:
      labels:
        app: api-core
    spec:
      containers:
        - name: api-core
          image: ecommerce-api-core:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: api-core-config
            - secretRef:
                name: api-core-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "350Mi"
