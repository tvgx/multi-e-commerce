apiVersion: v1
kind: ConfigMap
metadata:
  name: api-core-config
  namespace: ecommerce
data:
  PORT: "3001"
  NODE_ENV: "production"
  DATABASE_URL_SHARD_1: "postgresql://postgres:lordfedder222@db.dabexhaqtamfxcwpujuy.supabase.co:5432/postgres?schema=public"
  DATABASE_URL_SHARD_2: "postgresql://postgres:lordfedder222@db.dabexhaqtamfxcwpujuy.supabase.co:5432/postgres?schema=public"
