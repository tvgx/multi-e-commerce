apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: ecommerce
spec:
  ports:
    - port: 5200
  selector:
    app: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      containers:
        - name: admin
          image: ecommerce-admin:latest
          ports:
            - containerPort: 5200
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://api.ecommerce.local"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
